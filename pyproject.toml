[project]
name = "url-safety-investigator"
version = "0.1.0"
description = "Standalone, offline-first CLI tool that investigates whether a URL/site is likely phishing, a scam, malware-distributing, or legitimate."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
