name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      # The test suite stubs the embedding model, so the multi-gigabyte
      # sentence-transformers / torch install is skipped here.
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          grep -v '^sentence-transformers' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt pytest

      - name: Run tests
        run: python -m pytest -q
